# Two-machine SPHERE over Tailscale — layer on docker-compose.measure.yml.
# Publishes the Gatekeeper on 0.0.0.0:4324 (reachable at this host's tailnet IP) and sets a
# peer fallback so cross-node resolution works over the tailnet even before gossip converges.
#   SHARED topic on both machines: ARCHON_PROTOCOL=/aegis-sphere/<same-hex>
#   PEER_GATEKEEPER_URL=http://<peer-tailnet-ip>:4324
services:
  gatekeeper:
    ports: ["4324:4224"]                         # 0.0.0.0 -> reachable on the tailnet IP
    environment:
      - ARCHON_GATEKEEPER_FALLBACK_URL=${PEER_GATEKEEPER_URL:-}
