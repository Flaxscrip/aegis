name: Android Debug APK Attach to Release

permissions:
  contents: write

on:
  push:
    tags: ["*"]

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node 22.15.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.15.0"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install root dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build

      - name: Install app dependencies
        working-directory: ./apps/react-wallet
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/archon-debug.keystore

      - name: Build Android debug APK
        working-directory: ./apps/react-wallet
        env:
          CI: true
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/archon-debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-debug-artifact
          path: apps/react-wallet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-android-debug
    if: github.ref_type == 'tag'
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: app-debug-artifact

      # The downloaded artifact will be in the repository root
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
